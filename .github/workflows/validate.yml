name: Validate

on:
  pull_request:
    branches: [main]
  # NOTE: on-push (main) validation lives in npm-publish.yml as a prerequisite
  # job that gates the publish, so it isn't duplicated here. Running it in both
  # places would re-introduce the validate/publish race this split removes.

permissions:
  contents: read

# The npm CI gates live in a local composite action,
# .github/actions/validate-codebase — a mirror of the private
# pncit/shared-actions action (timezest is public and can't reference the
# private repo). See .github/actions/README.md.

jobs:
  validate:
    # Collaborator-only gate. Defense-in-depth alongside the repo setting
    # "Require approval for all outside collaborators": fork/outside PRs
    # evaluate this to false and the job is skipped, so untrusted code never
    # executes on the self-hosted runner. PRs from the repo owner, org members,
    # or collaborators run normally. Dependabot is allowed through — its PRs
    # come from in-repo branches (no fork code) and should still be validated.
    if: >-
      github.actor == 'dependabot[bot]' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: self-hosted
    steps:
      # Checkout first so (a) the version-bump gate has git history and (b) the
      # local ./.github/actions/validate-codebase action exists on disk.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Version-bump gate (PRs only): timezest is a published library, so every
      # PR into main must bump package.json's version.
      #
      # Dependabot PRs are exempt: they only bump dependency versions, never
      # the package's own version (that happens at release time), so this gate
      # would fail 100% of them. The version bump is applied when the batched
      # dependency updates are released.
      - name: Verify version changed
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        shell: bash
        run: |
          set -euo pipefail
          CUR=$(node -p "require('./package.json').version || ''")

          # Get the base branch (usually main)
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          git fetch origin "$BASE_BRANCH:$BASE_BRANCH" || true

          if git rev-parse --verify "$BASE_BRANCH" >/dev/null 2>&1; then
            PREV=$(git show "$BASE_BRANCH:package.json" 2>/dev/null \
              | node -p "(() => { const s=require('fs').readFileSync(0,'utf8'); try { return JSON.parse(s).version || '' } catch { return '' } })()" \
              || true)
          else
            PREV=""
          fi

          if [ -z "$CUR" ]; then
            echo "::error::No version found in package.json"
            exit 1
          fi

          if [ -n "$PREV" ] && [ "$CUR" = "$PREV" ]; then
            echo "::error::package.json version unchanged ($PREV -> $CUR). Version must be bumped for PRs."
            exit 1
          fi

          if [ -z "$PREV" ]; then
            echo "Could not determine previous version, skipping version check"
          else
            echo "Version changed: $PREV -> $CUR ✓"
          fi

      # npm ci + lint + typecheck + test (local mirror of shared-actions).
      - uses: ./.github/actions/validate-codebase
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
