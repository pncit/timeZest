name: Publish

# Consumes the Validate workflow's result instead of re-validating: publish
# only fires after a successful Validate run on main, and it ships the exact
# SHA that Validate ran against. A new push re-runs Validate (and thus a fresh
# publish); publish can never run without a successful validation for that
# commit.
#
# NOTE: `workflows:` below must match the Validate workflow's `name:` field.
on:
  workflow_run:
    workflows: ['Validate']
    types: [completed]
    branches: [main]
  # Manual recovery — e.g. re-publishing main after a transient registry error.
  # Skips the workflow_run gate; operator's call.
  workflow_dispatch:

# No id-token: this job authenticates with a classic npm token, not OIDC
# (see the publish job for why OIDC isn't usable here).
permissions:
  contents: read

# Serialize publishes: a newer publish supersedes an in-progress older one.
concurrency:
  group: publish-timezest
  cancel-in-progress: true

jobs:
  publish:
    # Only on a successful Validate that ran on main via push, or a manual
    # dispatch. PR-branch Validate runs are filtered out here.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.event == 'push')
    # Runs on SELF-HOSTED, like the rest of the pipeline. timezest is a PUBLIC
    # package, which rules out OIDC trusted publishing here: npm forces a
    # provenance attestation for public packages under OIDC, and provenance is
    # only supported on GitHub-hosted runners (self-hosted → HTTP 422). So this
    # job authenticates with a classic npm automation token (NODE_AUTH_TOKEN)
    # and publishes WITHOUT provenance. (node-quickbooks can use OIDC on
    # self-hosted only because it's a restricted package, which gets no
    # provenance. timezest being public is the difference.)
    #
    # Requires secrets.NPM_TOKEN to be an automation/granular token with
    # publish rights to the `timezest` package.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          # Pin to the commit Validate ran against, not main's current HEAD, so
          # a commit landing between Validate's success and this trigger can't
          # ship unvalidated. Empty for workflow_dispatch → falls back to the
          # default ref.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      # timezest is an unscoped, public package, so no `scope:` override and no
      # publishConfig.access — plain `npm publish` ships it public.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci

      # Unlike node-quickbooks (ships JS directly), timezest compiles to dist/
      # via tsc before publishing.
      - name: Build
        run: npm run build

      # Token auth via NODE_AUTH_TOKEN (the registry-url above wires it into
      # .npmrc). No --provenance: it's off by default with token auth, and
      # can't be used from self-hosted anyway. `npm publish` is a no-op failure
      # if the version already exists, so a push without a version bump simply
      # doesn't release.
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
