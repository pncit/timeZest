name: Publish

# Consumes the Validate workflow's result instead of re-validating: publish
# only fires after a successful Validate run on main, and it ships the exact
# SHA that Validate ran against.
#
# Footprint policy: validate (every PR + push) runs on self-hosted. Only the
# actual `npm publish` runs on a GitHub-hosted runner, and only when there's a
# new version to release — see the two-job split below. timezest is PUBLIC, so
# npm attaches an OIDC provenance attestation on publish, which npm only allows
# from GitHub-hosted runners (self-hosted → HTTP 422). Gating on a real version
# bump keeps GitHub-hosted minutes to actual releases; no-op/dependabot merges
# never reach the hosted job.
#
# NOTE: `workflows:` below must match the Validate workflow's `name:` field.
on:
  workflow_run:
    workflows: ['Validate']
    types: [completed]
    branches: [main]
  # Manual recovery — e.g. re-publishing main after a transient registry error.
  # Skips the workflow_run gate; operator's call.
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishes: a newer publish supersedes an in-progress older one.
concurrency:
  group: publish-timezest
  cancel-in-progress: true

jobs:
  # Cheap gate on SELF-HOSTED: only proceed to the GitHub-hosted publish when
  # package.json's version isn't already on npm. This is what keeps hosted
  # minutes to real releases — a push without a version bump (e.g. a dependabot
  # merge) stops here.
  check:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.event == 'push')
    runs-on: self-hosted
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Pin to the commit Validate ran against. Empty for workflow_dispatch
          # → falls back to the default ref (main).
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: decide
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME" version 2>/dev/null || echo "")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "$VER" = "$PUBLISHED" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VER is already on npm — nothing to publish, skipping the hosted job."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish $NAME@$VER (npm currently has ${PUBLISHED:-none})."
          fi

  # The ONLY GitHub-hosted job, and only when `check` says there's a new
  # version. Hosted is required for OIDC trusted publishing + provenance on a
  # public package. Post-merge trusted code, so no fork-PR exposure.
  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      # timezest is an unscoped, public package, so no `scope:` override and no
      # publishConfig.access — plain `npm publish` ships it public.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json

      # npm 11.5.1+ is required for OIDC trusted publishing + provenance.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Unlike node-quickbooks (ships JS directly), timezest compiles to dist/
      # via tsc before publishing.
      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance
