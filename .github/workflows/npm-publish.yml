name: publish-on-version-bump

on:
  push:
    branches: [main]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  # Validate the actual commit that landed on main BEFORE publishing. The PR's
  # validation ran against the PR head, but a squash/merge produces a new commit
  # that was never validated as-is — so we re-validate here. publish `needs` this
  # job, so a validation failure now blocks the publish.
  validate:
    runs-on: self-hosted
    steps:
      - uses: pncit/shared-actions/.github/actions/verify-node-toolchain@v1
        with:
          node-major-version: ${{ vars.NODE_MAJOR_VERSION }}
          npm-major-version: ${{ vars.NPM_MAJOR_VERSION }}

      # npm ci + lint + typecheck + test. Does its own checkout + setup-node.
      - uses: pncit/shared-actions/.github/actions/validate-codebase@v1
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

  publish:
    needs: validate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # timezest is an unscoped, public package, so no `scope:` override and no
      # publishConfig.access — plain `npm publish` ships it public via OIDC.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish
