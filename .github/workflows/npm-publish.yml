name: publish-on-version-bump

on:
  push:
    branches: [main]

permissions:
  id-token: write # Required for OIDC
  contents: read

# Self-contained — see validate.yml for why timezest inlines the gates instead
# of using pncit/shared-actions. Runs on self-hosted runners; this workflow
# only triggers on push to main (post-merge, trusted), so no fork-PR exposure.

jobs:
  # Validate the actual commit that landed on main BEFORE publishing. The PR's
  # validation ran against the PR head, but a squash/merge produces a new commit
  # that was never validated as-is — so we re-validate here. publish `needs` this
  # job, so a validation failure now blocks the publish.
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  publish:
    needs: validate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # timezest is an unscoped, public package, so no `scope:` override and no
      # publishConfig.access — plain `npm publish` ships it public via OIDC.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm 11.5.1+ is required for OIDC trusted publishing.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish
