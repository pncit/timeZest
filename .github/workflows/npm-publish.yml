name: publish-on-version-bump

on:
  push:
    branches: [main]

permissions:
  id-token: write # Required for OIDC
  contents: read

# The npm CI gates live in a local composite action,
# .github/actions/validate-codebase — a mirror of the private
# pncit/shared-actions action (timezest is public and can't reference the
# private repo). See .github/actions/README.md. Runs on self-hosted runners;
# this workflow only triggers on push to main (post-merge, trusted), so no
# fork-PR exposure.

jobs:
  # Validate the actual commit that landed on main BEFORE publishing. The PR's
  # validation ran against the PR head, but a squash/merge produces a new commit
  # that was never validated as-is — so we re-validate here. publish `needs` this
  # job, so a validation failure now blocks the publish.
  validate:
    runs-on: self-hosted
    steps:
      # Checkout first so the local ./.github/actions/validate-codebase action
      # exists on disk before it's referenced.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/validate-codebase
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

  publish:
    needs: validate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # timezest is an unscoped, public package, so no `scope:` override and no
      # publishConfig.access — plain `npm publish` ships it public via OIDC.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm 11.5.1+ is required for OIDC trusted publishing.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish
